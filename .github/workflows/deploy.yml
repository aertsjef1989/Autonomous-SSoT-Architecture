name: Deploy GitBook to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Leak Gate (Pre-Build)
        run: python3 scripts/leak_gate.py

      - name: Install dependencies and build HTML
        run: |
          npm install -g honkit
          honkit build
          mkdir -p _book/styles _book/signal/02_studio _book/balaerion/demo _book/syndicate/demo
          cp styles/website.css _book/styles/website.css
          if [ -d "DESIGN_SYSTEM_Signal/02_studio" ]; then
            cp -r DESIGN_SYSTEM_Signal/02_studio/* _book/signal/02_studio/
          fi
          if [ -d "DEMO" ]; then
            cp -r DEMO _book/demo
          if [ -d "assets" ]; then cp -r assets _book/assets; fi
          fi
          if [ -d "balaerion/demo" ]; then
            cp -r balaerion/demo/* _book/balaerion/demo/
          fi
          if [ -d "syndicate/demo" ]; then
            cp -r syndicate/demo/* _book/syndicate/demo/
          fi

      - name: Run Leak Gate (Built _book Verification)
        run: python3 scripts/leak_gate.py

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          publish_branch: gh-pages
          commit_message: "Automated deployment: ${{ github.sha }}"
