      <ellipse cx="193" cy="138" rx="413" ry="338" fill="url(#bg1plain)"/><text x="96.32" y="101.2" fill="#21E0DC" font-family="Carlito, Calibri, sans-serif" font-size="21.4" font-weight="700" text-anchor="start" letter-spacing="0">SECTION LABEL</text><text x="96.32" y="180.3" fill="#FFFFFF" font-family="Carlito, Calibri, sans-serif" font-size="57.2" font-weight="700" text-anchor="start" letter-spacing="0">Slide title goes here</text><rect x="461.01" y="234.54" width="0" height="427.59" rx="0" fill="#1A1D26" stroke="#1A1D26" stroke-width="1.5"/><rect x="123.84" y="448.29" width="674.24" height="0" rx="0" fill="#1A1D26" stroke="#1A1D26" stroke-width="1.5"/><ellipse cx="162.38000000000002" cy="273.08" rx="11.02" ry="11.02" fill="#F0245C" stroke="none" stroke-width="1.2"/><text x="189.85" y="279.6" fill="#FFFFFF" font-family="Carlito, Calibri, sans-serif" font-size="23.2" font-weight="700" text-anchor="start" letter-spacing="0">Quadrant 1</text><ellipse cx="499.45" cy="273.08" rx="11.02" ry="11.02" fill="#21E0DC" stroke="none" stroke-width="1.2"/><text x="527.02" y="279.6" fill="#FFFFFF" font-family="Carlito, Calibri, sans-serif" font-size="23.2" font-weight="700" text-anchor="start" letter-spacing="0">Quadrant 2</text><ellipse cx="162.38000000000002" cy="486.93" rx="11.02" ry="11.02" fill="#21E0DC" stroke="none" stroke-width="1.2"/><text x="189.85" y="493.4" fill="#FFFFFF" font-family="Carlito, Calibri, sans-serif" font-size="23.2" font-weight="700" text-anchor="start" letter-spacing="0">Quadrant 3</text><ellipse cx="499.45" cy="486.93" rx="11.02" ry="11.02" fill="#F0245C" stroke="none" stroke-width="1.2"/><text x="527.02" y="493.4" fill="#FFFFFF" font-family="Carlito, Calibri, sans-serif" font-size="23.2" font-weight="700" text-anchor="start" letter-spacing="0">Quadrant 4</text><text x="123.84" y="700.9" fill="#B9C0CE" font-family="Carlito, Calibri, sans-serif" font-size="19.7" font-weight="400" text-anchor="start" letter-spacing="0">Axis label, low to high</text><rect x="866.88" y="234.54" width="412.8" height="427.59" rx="8" fill="#15171F" stroke="#1A1D26" stroke-width="1" filter="url(#esoft)"/><text x="901.33" y="295.1" fill="#21E0DC" font-family="Carlito, Calibri, sans-serif" font-size="25.1" font-weight="700" text-anchor="start" letter-spacing="0">Read it clockwise</text><text x="901.33" y="342.6" fill="#B9C0CE" font-family="Carlito, Calibri, sans-serif" font-size="21.4" font-weight="400" text-anchor="start" letter-spacing="0">Use the four quadrants to place</text><text x="901.33" y="370.0" fill="#B9C0CE" font-family="Carlito, Calibri, sans-serif" font-size="21.4" font-weight="400" text-anchor="start" letter-spacing="0">options against two axes. Keep</text><text x="901.33" y="397.5" fill="#B9C0CE" font-family="Carlito, Calibri, sans-serif" font-size="21.4" font-weight="400" text-anchor="start" letter-spacing="0">one item per corner.</text></svg>