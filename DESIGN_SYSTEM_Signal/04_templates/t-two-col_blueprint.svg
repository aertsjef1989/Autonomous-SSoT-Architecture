" font-family="Carlito, Calibri, sans-serif" font-size="14.7" font-weight="700" text-anchor="start" letter-spacing="1.8">RIGHT</text><text x="740.76" y="264.4" fill="#273D55" font-family="Carlito, Calibri, sans-serif" font-size="18.8" font-weight="400" text-anchor="start" letter-spacing="0">The second half. Same shape, different weight, so the eye</text><text x="740.76" y="288.4" fill="#273D55" font-family="Carlito, Calibri, sans-serif" font-size="18.8" font-weight="400" text-anchor="start" letter-spacing="0">knows which one you believe.</text><path d="M53.38 674.55 L1322.6100000000001 674.55 L1334.6100000000001 686.55 L1334.6100000000001 734.9699999999999 L1322.6100000000001 746.9699999999999 L53.38 746.9699999999999 L41.38 734.9699999999999 L41.38 686.55 Z" fill="#273D55" stroke="#273D55" stroke-width="3"/><path d="M55.38 679.55 L1320.6100000000001 679.55 L1329.6100000000001 688.55 L1329.6100000000001 732.9699999999999 L1320.6100000000001 741.9699999999999 L55.38 741.9699999999999 L46.38 732.9699999999999 L46.38 688.55 Z" fill="none" stroke="#273D55" stroke-width="1" opacity="0.75"/><text x="688" y="716.8" fill="#F3F3EB" font-family="Carlito, Calibri, sans-serif" font-size="22.8" font-weight="700" text-anchor="middle" letter-spacing="0">The line they leave with.</text></svg>