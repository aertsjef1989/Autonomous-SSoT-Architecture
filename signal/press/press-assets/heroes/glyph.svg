<title>Signal hero glyph: a layered eighth note on a dense circuit board</title>
<desc>An original eighth-note mark with three offset copies stacked behind it for parallax depth, sitting on a dense printed-circuit network that flows top-left to middle-right, split cyan on the left and pink on the right with a glitch offset at the seam, on a near-black field.</desc>
