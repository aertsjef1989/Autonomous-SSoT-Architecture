<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balaerion — OmniRoute Gateway & GDPR Lane Simulator</title>
<style>
  :root { --bg:#08090D; --panel:#11141B; --alt:#171B24; --border:#232836; --ink:#F2F5F9; --muted:#8B95A5; --cyan:#21E0DC; --pink:#F0245C; --amber:#F5A623; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,monospace; padding:24px; }
  .wrap { max-width:1040px; margin:0 auto; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:18px; margin-bottom:16px; }
  h1 { margin:0 0 8px; font-size:20px; }
  .muted { color:var(--muted); font-size:12.5px; }
  .controls { display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin:14px 0; }
  label { display:inline-flex; gap:7px; align-items:center; font-size:13px; cursor:pointer; }
  select { background:var(--alt); color:var(--ink); border:1px solid var(--border); padding:7px 10px; border-radius:6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-top:14px; }
  .box { background:var(--alt); border:1px solid var(--border); border-radius:6px; padding:12px; font-size:12.5px; line-height:1.45; }
  .box.ok { border-color:var(--cyan); }
  .box.block { border-color:var(--pink); background:rgba(240,36,92,0.1); }
  .banner { padding:12px 14px; border-radius:6px; font-size:13px; font-weight:600; margin-top:12px; }
  .b-ok { background:rgba(33,224,220,0.12); border:1px solid var(--cyan); color:var(--cyan); }
  .b-err { background:rgba(240,36,92,0.14); border:1px solid var(--pink); color:var(--pink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Balaerion — OmniRoute Gateway, GDPR Lane &amp; Failover Simulator</h1>
    <div class="muted">Simulates Cloudflare Access MFA, per-key EU provider restrictions, Hetzner/Oracle ARM failover, and MCP research-vs-judgement routing.</div>
    <div class="controls">
      <label>Payload:
        <select id="payloadType" onchange="sim()">
          <option value="gdpr">NL/BE Client Data (GDPR Lane)</option>
          <option value="research">Public OSINT / Research</option>
        </select>
      </label>
      <label>Node:
        <select id="nodeMode" onchange="sim()">
          <option value="hetzner">Primary: Hetzner AX41 (x86_64)</option>
          <option value="oracle">Standby: Oracle ARM + NsJail</option>
        </select>
      </label>
      <label><input type="checkbox" id="mfaPass" checked onchange="sim()"> Cloudflare Access MFA Verified</label>
      <label><input type="checkbox" id="tryFreeTier" onchange="sim()"> Attempt Non-EU Free Tier</label>
    </div>
    <div id="banner"></div>
    <div id="grid" class="grid"></div>
  </div>
</div>
<script>
function sim() {
  const gdpr = document.getElementById('payloadType').value === 'gdpr';
  const oracle = document.getElementById('nodeMode').value === 'oracle';
  const mfa = document.getElementById('mfaPass').checked;
  const freeAttempt = document.getElementById('tryFreeTier').checked;
  const banner = document.getElementById('banner');
  const grid = document.getElementById('grid');

  if (!mfa) {
    banner.innerHTML = `<div class="banner b-err">ACCESS DENIED: Cloudflare Access MFA (Email OTP / Google SSO) required before reaching LibreChat or OmniRoute.</div>`;
  } else if (gdpr && freeAttempt) {
    banner.innerHTML = `<div class="banner b-err">GDPR LANE BLOCKED: API Manager blockedModels intercepted non-EU/free-tier call. Client data restricted to Scaleway (Paris) &amp; Mistral EU (opt-out).</div>`;
  } else {
    banner.innerHTML = `<div class="banner b-ok">ROUTING ACTIVE: ${gdpr ? 'GDPR EU Lane enforced (Scaleway Paris / Mistral EU, training opt-out).' : 'Free-tier retrieval returning raw source evidence for primary verification.'}</div>`;
  }

  grid.innerHTML = `
    <div class="box ${mfa?'ok':'block'}"><strong>1. Access Gate</strong><br>${mfa?'Cloudflare Access MFA valid':'Blocked at Cloudflare Tunnel'}</div>
    <div class="box ${gdpr && freeAttempt ? 'block' : 'ok'}"><strong>2. OmniRoute Key Policy</strong><br>${gdpr ? (freeAttempt ? 'Blocked: non-EU provider denied' : 'Allowed: Scaleway EU / Mistral EU') : 'Allowed: 90+ free-tier retrieval pool'}</div>
    <div class="box ok"><strong>3. Host &amp; Sandbox</strong><br>${oracle ? 'Oracle ARM (2 OCPU, 12GB) + LibreCodeInterpreter (NsJail)' : 'Hetzner AX41 (64GB NVMe) primary'}</div>
    <div class="box ok"><strong>4. MCP Orchestrator</strong><br>23 active agents · Concurrent execution · Evidence-only retrieval</div>`;
}
sim();
</script>
</body>
</html>
