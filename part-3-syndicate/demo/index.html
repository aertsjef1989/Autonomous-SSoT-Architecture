<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syndicate Matchday AI — Poisson / xG & NAV Ledger Demo</title>
<style>
  :root { --bg:#08090D; --panel:#11141B; --alt:#171B24; --border:#232836; --ink:#F2F5F9; --muted:#8B95A5; --cyan:#21E0DC; --pink:#F0245C; --amber:#F5A623; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,monospace; padding:24px; }
  .wrap { max-width:1040px; margin:0 auto; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:18px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-top:12px; }
  h1,h3 { margin:0 0 10px; }
  h3 { color:var(--cyan); font-size:14px; text-transform:uppercase; letter-spacing:0.6px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  input[type="number"], input[type="range"] { width:100%; accent-color:var(--cyan); }
  input[type="number"] { background:var(--alt); color:var(--ink); border:1px solid var(--border); padding:7px 10px; border-radius:6px; }
  .stat { background:var(--alt); border:1px solid var(--border); border-radius:6px; padding:12px; }
  .val { font-size:22px; font-weight:800; color:var(--cyan); margin-top:4px; }
  .chk { display:inline-flex; gap:8px; align-items:center; color:var(--ink); font-size:13px; margin-top:10px; cursor:pointer; }
  .banner { padding:10px 14px; border-radius:6px; font-size:13px; font-weight:600; margin-top:12px; }
  .b-cyan { background:rgba(33,224,220,0.12); border:1px solid var(--cyan); color:var(--cyan); }
  .b-pink { background:rgba(240,36,92,0.14); border:1px solid var(--pink); color:var(--pink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Syndicate Matchday AI — Poisson / xG &amp; Unit-Share NAV Lab</h1>
    <div class="grid">
      <div>
        <label>Home Expected Goals (lambda_H): <strong id="lhLbl">1.65</strong></label>
        <input type="range" id="lh" min="0.4" max="3.5" step="0.05" value="1.65" oninput="recalc()">
      </div>
      <div>
        <label>Away Expected Goals (lambda_A): <strong id="laLbl">1.10</strong></label>
        <input type="range" id="la" min="0.4" max="3.5" step="0.05" value="1.10" oninput="recalc()">
      </div>
      <div>
        <label>Pool Value (EUR)</label>
        <input type="number" id="poolVal" value="2500" step="50" oninput="recalc()">
      </div>
      <div>
        <label>Active Units Issued</label>
        <input type="number" id="unitsTot" value="200" step="10" oninput="recalc()">
      </div>
    </div>
    <div class="grid" id="probsGrid"></div>
    <div class="grid" id="navGrid"></div>
    <label class="chk"><input type="checkbox" id="kickoffLocked" checked onchange="recalc()"> Pre-Kickoff Slip Lock Active (Blocks Post-Cutoff Edits)</label>
    <div id="lockBanner"></div>
  </div>
</div>
<script>
function poisson(k, lam) {
  let fact = 1;
  for (let i = 2; i <= k; i++) fact *= i;
  return (Math.pow(lam, k) * Math.exp(-lam)) / fact;
}
function recalc() {
  const lh = parseFloat(document.getElementById('lh').value);
  const la = parseFloat(document.getElementById('la').value);
  const pool = Math.max(1, parseFloat(document.getElementById('poolVal').value) || 1);
  const units = Math.max(1, parseFloat(document.getElementById('unitsTot').value) || 1);
  const locked = document.getElementById('kickoffLocked').checked;

  document.getElementById('lhLbl').textContent = lh.toFixed(2);
  document.getElementById('laLbl').textContent = la.toFixed(2);

  let pH = 0, pD = 0, pA = 0;
  for (let h = 0; h <= 7; h++) {
    for (let a = 0; a <= 7; a++) {
      const p = poisson(h, lh) * poisson(a, la);
      if (h > a) pH += p; else if (h === a) pD += p; else pA += p;
    }
  }
  const nav = pool / units;
  const sampleDeposit = 250;
  const mintedUnits = sampleDeposit / nav;

  document.getElementById('probsGrid').innerHTML = `
    <div class="stat"><div class="muted">Home Win (Poisson)</div><div class="val">${(pH*100).toFixed(1)}%</div></div>
    <div class="stat"><div class="muted">Draw (Poisson)</div><div class="val">${(pD*100).toFixed(1)}%</div></div>
    <div class="stat"><div class="muted">Away Win (Poisson)</div><div class="val">${(pA*100).toFixed(1)}%</div></div>`;

  document.getElementById('navGrid').innerHTML = `
    <div class="stat"><div class="muted">Current NAV / Unit</div><div class="val">EUR ${nav.toFixed(2)}</div></div>
    <div class="stat"><div class="muted">Units for EUR 250 Deposit</div><div class="val">+${mintedUnits.toFixed(2)}</div></div>
    <div class="stat"><div class="muted">Dashboard Mode</div><div class="val" style="font-size:16px;">Read-Only Next.js</div></div>`;

  document.getElementById('lockBanner').innerHTML = locked
    ? `<div class="banner b-cyan">SLIP LOCK ENFORCED: Matchday votes and stakes are frozen prior to kickoff; settlement writes append-only ledger rows.</div>`
    : `<div class="banner b-pink">UNLOCKED WARNING: Post-cutoff slip edits enabled — vulnerable to hindsight bias or settlement disputes.</div>`;
}
recalc();
</script>
</body>
</html>
